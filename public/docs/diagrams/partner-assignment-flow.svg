<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 558" role="img" aria-labelledby="title desc"><title id="title">Partner assignment flow</title><desc id="desc">Authenticate the backend, link teacher and learner, create and launch an assignment, then read recorded results. Paths are relative to the API v3 base.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="598" height="556" rx="20" fill="#f8fafc" stroke="#cbd5e1"/><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="24" y="24" width="552" height="106" rx="12" fill="white" stroke="#cbd5e1"/><circle cx="62" cy="62" r="19" fill="#e0e7ff"/><text x="62" y="70" text-anchor="middle" font-size="23" font-weight="700" fill="#4338ca">1</text><text x="94" y="69" font-size="25" font-weight="650" fill="#0f172a">Authenticate your backend</text><text x="44" y="105" font-size="19" fill="#475569">POST /oauth2/token</text><path d="M300 134 V152" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="158" width="552" height="106" rx="12" fill="white" stroke="#cbd5e1"/><circle cx="62" cy="196" r="19" fill="#e0e7ff"/><text x="62" y="204" text-anchor="middle" font-size="23" font-weight="700" fill="#4338ca">2</text><text x="94" y="203" font-size="25" font-weight="650" fill="#0f172a">Link teacher and learner</text><text x="44" y="239" font-size="19" fill="#475569">POST /users</text><path d="M300 268 V286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="292" width="552" height="106" rx="12" fill="white" stroke="#cbd5e1"/><circle cx="62" cy="330" r="19" fill="#e0e7ff"/><text x="62" y="338" text-anchor="middle" font-size="23" font-weight="700" fill="#4338ca">3</text><text x="94" y="337" font-size="25" font-weight="650" fill="#0f172a">Create and launch practice</text><text x="44" y="373" font-size="19" fill="#475569">POST /assignments · POST /assignments/{id}/joins</text><path d="M300 402 V420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="426" width="552" height="106" rx="12" fill="white" stroke="#cbd5e1"/><circle cx="62" cy="464" r="19" fill="#e0e7ff"/><text x="62" y="472" text-anchor="middle" font-size="23" font-weight="700" fill="#4338ca">4</text><text x="94" y="471" font-size="25" font-weight="650" fill="#0f172a">Read recorded results</text><text x="44" y="507" font-size="19" fill="#475569">GET /assignments/{id} · follow players pagination</text></g></svg>
