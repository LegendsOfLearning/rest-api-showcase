<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 424" role="img" aria-labelledby="title desc"><title id="title">Multiplication fact family</title><desc id="desc">The seed 3 times 9 expands to 3 times 9, 9 times 3, 27 divided by 3 and 27 divided by 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="598" height="422" rx="20" fill="#f8fafc" stroke="#cbd5e1"/><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="300" y="37" text-anchor="middle" font-size="19" fill="#475569">Seed fact</text><rect x="180" y="53" width="240" height="79" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/><text x="300" y="104" text-anchor="middle" font-size="36" font-weight="700" fill="#3730a3">3 × 9</text><path d="M300 143 V174" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="206" text-anchor="middle" font-size="19" fill="#475569">Expanded fact pool</text><rect x="24" y="228" width="268" height="76" rx="12" fill="white" stroke="#cbd5e1"/><text x="158" y="277" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">3 × 9 = 27</text><rect x="308" y="228" width="268" height="76" rx="12" fill="white" stroke="#cbd5e1"/><text x="442" y="277" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">9 × 3 = 27</text><rect x="24" y="324" width="268" height="76" rx="12" fill="white" stroke="#cbd5e1"/><text x="158" y="373" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">27 ÷ 3 = 9</text><rect x="308" y="324" width="268" height="76" rx="12" fill="white" stroke="#cbd5e1"/><text x="442" y="373" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">27 ÷ 9 = 3</text></g></svg>
